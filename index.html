<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four-Plate Week</title>
<meta name="description" content="A 4-day, under-60-minute strength, cardio and mobility program.">
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Four-Plate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, sticky header, bottom tab bar; each training day is coded by a bumper-plate color */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --sunk:#E3E8E5; --ink:#16201C; --muted:#5A6762; --line:#D3DBD7;
  --blue:#1F5FA8; --green:#2C7A4E; --yellow:#B88A00; --red:#BF3A2C;
  --blue-t:#E2ECF7; --green-t:#E1F0E7; --yellow-t:#F7EFD3; --red-t:#F8E3E0;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --sunk:#202A26; --ink:#E5ECE8; --muted:#94A39C; --line:#2B3632;
  --blue:#6EA6E6; --green:#5DBB86; --yellow:#E6BC35; --red:#EC6F5F;
  --blue-t:#17263A; --green-t:#16291F; --yellow-t:#2B2510; --red-t:#311A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --sunk:#202A26; --ink:#E5ECE8; --muted:#94A39C; --line:#2B3632;
  --blue:#6EA6E6; --green:#5DBB86; --yellow:#E6BC35; --red:#EC6F5F;
  --blue-t:#17263A; --green-t:#16291F; --yellow-t:#2B2510; --red-t:#311A17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}

.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand .plates{display:inline-flex;gap:3px;margin-right:8px;vertical-align:2px}
.brand .plates i{width:7px;height:20px;border-radius:2px;display:block}
.sub{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:right}

main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 32px)}
main .wrap{display:flex;flex-direction:column;gap:22px;padding-block:18px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:40px}
h2{font-size:26px;letter-spacing:.01em}
h3{font-size:19px;letter-spacing:.02em}
p{margin:0}
.lede{font-size:16px;color:var(--muted);max-width:60ch}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:12px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .row{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"] svg{stroke-width:2.4}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;cursor:default}
.dayc .d{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.dayc .disc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff}
.dayc .disc.off{background:var(--sunk);color:var(--muted)}
.dayc .l{font-size:10.5px;line-height:1.2;color:var(--muted)}
.dayc.gym{cursor:pointer}
.dayc.today{border-color:var(--ink);border-width:2px}

.bg-blue{background:var(--blue)} .bg-green{background:var(--green)} .bg-yellow{background:var(--yellow)} .bg-red{background:var(--red)}
.c-blue{color:var(--blue)} .c-green{color:var(--green)} .c-yellow{color:var(--yellow)} .c-red{color:var(--red)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:baseline}
.kv .k{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap}
.kv .v{color:var(--muted);font-size:14px;min-width:0}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.plain li::marker{color:var(--muted)}

/* train */
.plates-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.pp .disc{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative}
.pp .disc::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--surface)}
.pp .n{font-size:11px;font-weight:700;letter-spacing:.08em}
.pp .t{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.pp[aria-pressed="true"]{border-color:var(--ink);border-width:2px;padding:9px 5px}

.sess-head{display:flex;flex-direction:column;gap:8px}
.timebar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line)}
.timebar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}

.block{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.block-h .note{font-size:12.5px;color:var(--muted);margin-top:2px}
.ex{border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex-row{display:grid;grid-template-columns:44px 1fr auto;gap:6px;align-items:center;padding:6px 14px 6px 6px}
.chk{width:44px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent}
.chk i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chk[aria-pressed="true"] i{border-color:transparent;background:var(--done)}
.chk[aria-pressed="true"] svg{opacity:1}
.ex-name{min-height:44px;justify-content:center}
.ex-name{background:none;border:0;text-align:left;padding:0;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:1px}
.ex-name b{font-weight:600;font-size:15px}
.ex-name .rx{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.ex-tag{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.ex.done .ex-name b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.howto{padding:0 14px 14px 56px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.howto .lab{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.howto .watch{font-size:13px;font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;align-self:flex-start}
.chev{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .15s}
.ex.open .chev{transform:rotate(90deg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}

/* library */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.card .lab{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* review */
.verdicts{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0;padding-top:0}
.vrow b{font-weight:600}
.vrow span{color:var(--muted);font-size:14px}
.stamp{display:inline-block;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;padding:2px 8px;border-radius:4px;text-transform:uppercase;margin-right:6px;vertical-align:1px}
.st-keep{background:var(--green-t);color:var(--green)}
.st-change{background:var(--blue-t);color:var(--blue)}
.st-cut{background:var(--red-t);color:var(--red)}
.st-add{background:var(--yellow-t);color:var(--yellow)}
.change-list{counter-reset:c;display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.change-list li{display:grid;grid-template-columns:28px 1fr;gap:10px}
.change-list li::before{counter-increment:c;content:counter(c);font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;color:var(--muted)}
.change-list b{display:block}
.change-list span{color:var(--muted);font-size:14px}
.src{display:flex;flex-direction:column;gap:8px;font-size:14px}
.src a{text-decoration:none;border-bottom:1px solid var(--line)}
.src .who{color:var(--muted);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.callout{border-left:4px solid var(--red);background:var(--red-t);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px}
.tests{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:14px}
.tests .t{min-width:0}
.tests .t span{display:block;color:var(--muted);font-size:12.5px}
.tests .g{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:400px){h1{font-size:34px}.dayc .l{display:none}.brand{font-size:22px}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><span class="plates" aria-hidden="true"><i class="bg-blue"></i><i class="bg-green"></i><i class="bg-yellow"></i><i class="bg-red"></i></span>Four-Plate Week</div>
  <div class="sub">4 days · ≤60 min</div>
</div></header>

<main>
  <div class="wrap" id="view"></div>
</main>

<nav class="tabs" aria-label="Sections"><div class="row" role="tablist">
  <button role="tab" data-tab="week" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button role="tab" data-tab="train" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/></svg>Train</button>
  <button role="tab" data-tab="home" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button role="tab" data-tab="moves" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v6l-4 8M12 13l4 8M6 10l6-2 6 2"/></svg>Moves</button>
  <button role="tab" data-tab="why" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>Why</button>
</div></nav>

<script>
/* ---------- Exercise library ---------- */
const E = {
  backwalk:{n:"Backward Walk / Sled Drag",tags:["Knee","Warm-up"],cue:"Short steps on the balls of your feet. With a sled, lean back, arms straight, and drag.",why:"Loads the quads hard with almost no knee stress. Ben Patrick's go-to knee warm-up, kept from Program 1 and upgraded to a sled when available.",swap:"Backward treadmill walk, 1.5–2 mph, no incline.",q:"backward sled drag knee"},
  wgs:{n:"World's Greatest Stretch",tags:["Mobility","Warm-up"],cue:"Long lunge, same-side elbow to instep, then rotate and reach that arm to the ceiling. Move, don't hold.",why:"Hip flexors, hamstrings and thoracic spine in one move. Kept from both programs.",swap:"Spiderman lunge with reach.",q:"world's greatest stretch"},
  hip9090:{n:"90/90 Hip Switches",tags:["Mobility","Warm-up"],cue:"Both knees bent 90°. Rotate the knees side to side without hands. Progress to lifting the back knee off the floor.",why:"Active hip rotation instead of a long passive hold, so it warms you up without sapping strength.",swap:"Seated windshield wipers.",q:"90 90 hip switch lift off"},
  gobletpry:{n:"Goblet Squat Pry",tags:["Mobility","Warm-up"],cue:"Light bell at your chest, sit to the bottom, push knees out with elbows, shift side to side.",why:"Grooves squat depth right before squatting.",swap:"Bodyweight deep squat holding a post.",q:"goblet squat pry"},
  pullapart:{n:"Band Pull-Apart",tags:["Warm-up","Shoulder"],cue:"Arms straight, pull the band to your chest by squeezing the shoulder blades.",why:"Wakes up the upper back before pressing.",swap:"Light cable reverse fly.",q:"band pull apart"},
  pogo:{n:"Pogo Hops",tags:["Power","Warm-up","Knee"],cue:"Small, quick bounces on the balls of your feet. Stiff ankles, soft knees. Skip if the knee is flaring.",why:"Primes tendons and ankles before jumps. A low-dose stand-in for the jump rope and bounding from Program 1.",swap:"1–2 min easy jump rope, or fast calf raises.",q:"pogo hops"},
  squat:{n:"Back Squat",tags:["Strength"],cue:"Brace before you descend. Knees track over toes, hit at least parallel, drive chest and hips up together.",why:"Biggest return for leg strength and bone loading. Kept from both programs.",swap:"Block 2: front squat or safety-bar squat. Knee flare: box squat to parallel.",q:"back squat technique"},
  deadhang:{n:"Dead Hang",tags:["Grip","Shoulder","Mobility"],cue:"Straight arms, shoulders active (not shrugged into the ears), slow breathing.",why:"Grip strength tracks closely with long-term health, and hanging opens the shoulders and unloads the spine. Fits in your squat rest periods at no time cost.",swap:"Heavy DB holds for time.",q:"dead hang shoulders"},
  bench:{n:"Bench Press",tags:["Strength"],cue:"Shoulder blades pinned, feet driving into the floor, bar to lower chest, 2 s down.",why:"Main horizontal push. Kept from both programs.",swap:"Block 2: incline DB press. Cranky shoulder: neutral-grip DB press.",q:"bench press technique"},
  csrow:{n:"Chest-Supported DB Row",tags:["Strength"],cue:"Chest on a 30–45° bench, pull elbows toward your hips, pause 1 s at the top.",why:"Horizontal pull with no low-back cost, which saves your back for Sunday deadlifts. Replaces the barbell row.",swap:"Seal row or seated cable row.",q:"chest supported dumbbell row"},
  cossack:{n:"Cossack Squat",tags:["Strength","Mobility"],cue:"Wide stance. Sit into one hip with the other leg straight, toes up. Heel stays down. Add a goblet weight once 8 per side is easy.",why:"Side-to-side strength and adductor range. Both old programs trained almost only forward-and-back. Chasing kids and catching a fall happen sideways.",swap:"Lateral lunge to a box (shorter range).",q:"cossack squat"},
  facepull:{n:"Face Pull",tags:["Shoulder"],cue:"Rope to forehead, elbows high, finish with hands beside your ears, thumbs pointing back.",why:"Rear delts and rotator cuff for long-term shoulder health. Kept from both.",swap:"Band pull-apart, band external rotation.",q:"face pull technique"},
  tibraise:{n:"Tibialis Raise",tags:["Knee"],cue:"Back against a wall, heels a foot out, pull toes to shins, 1 s squeeze, slow lower.",why:"Shin strength for ankles and knees, from the ATG system. Kept.",swap:"Banded dorsiflexion.",q:"tibialis raise wall"},
  copenhagen:{n:"Copenhagen Side Plank",tags:["Knee","Core"],cue:"Top leg on a bench (knee for easier, ankle for harder), lift hips into a straight line and hold.",why:"Adductor strength. One Copenhagen exercise cut groin problems by 41% in a 652-player randomized trial (Harøy 2019).",swap:"Side-lying adductor raise.",q:"copenhagen plank progression"},
  z2:{n:"Zone 2 Cardio",tags:["Cardio"],cue:"Steady pace where you can talk in full sentences but would rather not. Nose breathing is a good check. Roughly 60–70% of max HR, or about 60–75% of FTP on Zwift.",why:"Builds the aerobic base and is most of your weekly cardio. The bike, rower, incline walk and SkiErg are all easy on the knee.",swap:"Zwift at home · rower · incline treadmill walk · SkiErg · ruck walk.",q:"zone 2 training explained"},
  tgu:{n:"Turkish Get-Up",tags:["Core","Mobility","Shoulder"],cue:"Eyes on the bell the whole way. At home, start with a shoe balanced on your fist and move to the 45 lb bell once that's smooth. Roll, post, bridge, sweep, stand. Reverse it slowly.",why:"Shoulder stability, core and floor-to-standing in one drill. Kept from both, now on the mobility day.",swap:"Half get-up.",q:"turkish get up tutorial"},
  deepsquat:{n:"Deep Squat Hold",tags:["Mobility"],cue:"Heels down, sit all the way to the bottom, chest tall. Hold a post if needed.",why:"Keeps the bottom position you'll want at 80 for getting off the floor with grandkids. Kept from both.",swap:"Goblet squat hold with a light bell.",q:"deep squat hold"},
  couch:{n:"Couch Stretch",tags:["Mobility","Knee"],cue:"Back knee against a wall or couch, front foot forward, squeeze the back glute and tuck the pelvis.",why:"Hip flexor and quad length for knees and low back. Long static holds belong here, away from heavy lifting.",swap:"Half-kneeling hip flexor stretch.",q:"couch stretch"},
  thread:{n:"Thread the Needle",tags:["Mobility"],cue:"On all fours, slide one arm under your body until the shoulder touches the floor, then open up to the ceiling.",why:"Thoracic rotation with the hips locked. Kept from both.",swap:"Open-book stretch.",q:"thread the needle thoracic"},
  catcow:{n:"Cat-Cow",tags:["Mobility"],cue:"Slow, one vertebra at a time, breathe through each rep.",why:"Spinal warm-up. Kept.",swap:"Segmental rolling.",q:"cat cow"},
  wallangel:{n:"Wall Angels",tags:["Mobility","Shoulder"],cue:"Back, head, elbows and wrists touching the wall. Slide arms up and down slowly.",why:"Overhead shoulder range lost to desks and pressing. Kept, moved to home.",swap:"Floor angels.",q:"wall angels"},
  balance:{n:"Single-Leg Balance",tags:["Mobility","Knee"],cue:"One foot, arms crossed, eyes closed, 30 s. Open your eyes to make it easier.",why:"Balance declines early and predicts falls. Being unable to stand 10 s on one leg in midlife was linked to higher mortality (Araújo 2022, BJSM).",swap:"Eyes open on a pillow.",q:"single leg balance eyes closed"},
  boxjump:{n:"Box Jump",tags:["Power"],cue:"Low-to-mid box. Explode up, land soft and quiet, stand tall, step down. Fully reset each rep.",why:"Power fades faster than strength with age, and jumps keep it. Stepping down spares the knee from landing load.",swap:"Knee flare: med-ball chest pass or 6 s bike sprints.",q:"box jump technique step down"},
  mbthrow:{n:"Rotational Med Ball Throw",tags:["Power","Core"],cue:"Side-on to a wall, load the back hip, rotate and throw hard. Catch, reset.",why:"Rotational power from the hips, the motion behind swinging, throwing and lifting a kid sideways. Replaces slams and battle ropes.",swap:"Landmine rotational press (from your old programs).",q:"rotational medicine ball throw"},
  landmine:{n:"Landmine Rotational Press",tags:["Power","Core"],cue:"Drive from the back hip, rotate and press in one motion.",why:"From both old programs. Kept as the swap for med ball throws.",swap:"Single-arm DB press with rotation.",q:"landmine rotational press"},
  kbswing:{n:"Kettlebell Swing",tags:["Power","Cardio"],cue:"Hike the bell back like a snap, snap the hips through, bell floats to chest height. Arms are ropes.",why:"Hip power and conditioning in one. Kept from both programs.",swap:"Trap-bar jump or DB swing.",q:"kettlebell swing hardstyle"},

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const check = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
const chev = '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const todayDow = new Date().getDay();

function howto(id){
  const x = E[id];
  return `<div class="howto" hidden>
    <div><div class="lab">How</div><p>${esc(x.cue)}</p></div>
    <div><div class="lab">Why it's here</div><p>${esc(x.why)}</p></div>
    <div><div class="lab">Swap</div><p>${esc(x.swap)}</p></div>
    <a class="watch" href="${yt(x.q)}" target="_blank" rel="noopener">Watch demos ↗</a>
  </div>`;
}
function exRow(it, key, i, plate){
  const [id, rx, tag] = it; const x = E[id];
  const done = key ? !!(store.get("done-"+key, {})[i]) : false;
  return `<div class="ex${done?" done":""}" data-i="${i}">
    <div class="ex-row">
      ${key ? `<button class="chk" aria-pressed="${done}" aria-label="Mark ${esc(x.n)} done" style="--done:var(--${plate})"><i>${check}</i></button>` : `<span></span>`}
      <button class="ex-name" aria-expanded="false"><b>${esc(x.n)}</b><span class="rx">${esc(rx)}</span></button>
      <span class="ex-tag">${tag?esc(tag):""} ${chev}</span>
    </div>${howto(id)}</div>`;
}
function bindRows(root, key, plate){
  root.querySelectorAll(".ex").forEach(ex => {
    const nm = ex.querySelector(".ex-name"), hw = ex.querySelector(".howto");
    const toggle = () => { const o = hw.hidden; hw.hidden = !o; ex.classList.toggle("open", o); nm.setAttribute("aria-expanded", o); };
    nm.addEventListener("click", toggle);
    ex.querySelector(".ex-tag").addEventListener("click", toggle);
    const c = ex.querySelector(".chk");
    if (c && key) c.addEventListener("click", () => {
      const st = store.get("done-"+key, {}); const i = ex.dataset.i; st[i] = !st[i]; store.set("done-"+key, st);
      c.setAttribute("aria-pressed", !!st[i]); ex.classList.toggle("done", !!st[i]);
    });
  });
}

  const total = s.blocks.reduce((a,b) => a + b.m, 0);
  const shades = ["", "opacity:.82", "opacity:.64", "opacity:.5", "opacity:.38", "opacity:.28"];
  const pick = S.map((x,i) => `<button class="pp" aria-pressed="${x.id===cur}" data-day="${x.id}"><span class="disc bg-${x.plate}"></span><span class="n">${x.day.slice(0,3).toUpperCase()}</span><span class="t">${x.name}</span></button>`).join("");
  const bar = s.blocks.map((b,i) => `<span class="bg-${s.plate}" style="flex:${b.m};${shades[i]||""}" title="${esc(b.t)} ${b.m} min"></span>`).join("");
  let idx = 0;
  const blocks = s.blocks.map(b => `<div class="block">
      <div class="block-h"><div><h3>${esc(b.t)}</h3>${b.note?`<div class="note">${esc(b.note)}</div>`:""}</div><span class="mono">${b.m} min</span></div>
      ${b.items.map(it => exRow(it, s.id, idx++, s.plate)).join("")}
    </div>`).join("");
  return `
  <div class="plates-pick" role="group" aria-label="Training day">${pick}</div>
  <section class="sess-head">
    <span class="eyebrow c-${s.plate}">Day ${S.indexOf(s)+1} · ${s.day}</span>
    <h1>${esc(s.name)}</h1>
    <p class="lede">${esc(s.focus)}</p>
    <div class="timebar" aria-label="Session time budget">${bar}</div>
    <div class="legend"><span class="mono">${total} min</span>${s.blocks.map(b => `<span>${esc(b.t.split(" · ").pop())} ${b.m}</span>`).join("")}</div>
  </section>
  ${blocks}
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="btn" id="reset">Clear checkmarks</button>
    <span style="color:var(--muted);font-size:13px">Tap any exercise for how-to, why and swaps.</span>
  </div>`;
};
V.home = () => `

let libQ = "", libTag = "All";

};
function renderLib(){
  const q = libQ.toLowerCase();
  const list = Object.values(E).filter(x => (libTag === "All" || x.tags.includes(libTag)) && (!q || (x.n + " " + x.cue + " " + x.why).toLowerCase().includes(q)));
  $("#lib").innerHTML = list.length ? list.map(x => `<div class="card">
    <div class="top"><h3>${esc(x.n)}</h3><div class="tags">${x.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div></div>

}
V.why = () => {
  const R = [
   ["keep","Back squat, deadlift, bench press, pull-ups","The backbone of both programs. Heavy compound lifts at low volume are the most time-efficient way to stay strong."],
   ["keep","Nordic curl, ATG split squat, tibialis raise, step-downs, backward walking","Your knee and hamstring armor. Nordics have the best injury-prevention evidence of any single exercise."],
   ["keep","KB swing, box jump, Turkish get-up, dead bug, face pull","Power, shoulder health and core. Get-ups moved to Friday's mobility circuit."],
   ["keep","World's greatest stretch, 90/90, thread the needle, cat-cow, deep squat, couch stretch, wall angels","Same drills, now split between a short dynamic warm-up and the home and Friday sessions."],
   ["change","10–15 min static warm-up → 6–7 min dynamic ramp","Long static holds (60 s or more) right before lifting reduce strength. They moved to Friday, home days and evenings."],
   ["change","3-day A/B/C rotation → fixed 4-day plate week","Squat on Wednesday and deadlift on Sunday sit 3–4 days apart. Power and VO2max come on Saturday, after an easy Friday."],

   ["change","Clamshells and plank → side plank with hip abduction","More glute-medius work and lateral core in one exercise."],
   ["change","Assault bike 20/40 → Norwegian 4×4","The best-studied VO2max protocol. 20/40 stays as the swap."],
   ["change","Optional 1–2 cardio days → scheduled Zone 2 day, finishers and walks","Cardio fitness is the strongest single fitness predictor of lifespan. It was the least-structured part of both docs."],
   ["change","Hanging knee raise → dead hangs during squat rest","Grip and shoulder health at no time cost."],
   ["change","Bulgarian split squat ↔ ATG split squat","They now alternate by block instead of both running at once."],
   ["cut","IT band foam rolling, standing IT band stretch","Rolling doesn't change IT band stiffness or hip range in trials. Hip strengthening is what helps, so that time went to side planks and Copenhagens."],
   ["cut","Glute bridge / hip thrust, DB incline press, dips, barbell row","Redundant with the main lifts and didn't fit in 60 minutes. Incline DB press comes back as the Block 2 bench variation."],
   ["cut","Burpees, battle ropes, med-ball slams","Generic conditioning. Replaced by targeted Zone 2, the 4×4 and rotational throws."],
   ["change","15-min jump-rope intervals → 3 × 30 s rope warm-ups at home","Keeps the ankle and coordination benefit at a dose the knee tolerates. Skip it on flare-up days. Build toward longer rope work after 8 pain-free weeks."],
   ["cut","Bounding / single-leg hops","Highest-impact drill in either doc, and your knee flares with volume. Box jumps with a step-down give the power without the landings."],
   ["add","Zwift Zone 2 and a Zwift 4×4 backup","Turns your WFH Friday and two rest-day evenings into knee-friendly cardio with no commute. That's how 150 min/week becomes realistic."],
   ["add","Kettlebell 20 home circuit (45 lb)","Swings, goblet squats, presses, rows and carries with one bell. A home strength day for short weeks."],

   ["add","Cossack squat, Copenhagen plank","Both old programs were almost entirely forward-and-back. These add strength and range in the side-to-side plane."],
   ["add","Farmer and suitcase carries, dead hangs","Grip and loaded walking: the most practical longevity strength there is."],
   ["add","Rotational med-ball throws","Power fades faster than strength with age. Throws train rotational power safely."],
   ["add","Zone 2 sessions, Norwegian 4×4, sled work","A real cardio plan with low knee stress."],
   ["add","Single-leg balance, sitting-rising practice, exercise snacks","Cheap, research-linked markers of how well you'll move at 80."]
  ];
  const label = {keep:"Kept",change:"Changed",cut:"Cut",add:"Added"};
  let filt = store.get("whyf","all");
  return `
  <section>
    <span class="eyebrow">The review</span>
    <h1>What changed and why</h1>
    <p class="lede">Your two programs agreed on almost everything, and most of it was good. The gaps were cardio, time, frontal-plane strength and how the stretching was placed.</p>
  </section>
  <section class="panel">
    <h3>The nine big moves</h3>
    <ol class="change-list">
      <li><div><b>Cardio went from optional to scheduled.</b><span>In 122,000 treadmill-tested adults, the least fit had about 5× the death risk of the fittest (Mandsager 2018). That's a bigger gap than smoking.</span></div></li>
      <li><div><b>Zone 2 base plus one VO2max day.</b><span>The pattern used by Peter Attia, by endurance coaches and in the Norwegian 4×4 research: lots of easy work and a little very hard work.</span></div></li>
      <li><div><b>Every session fits in 60 minutes.</b><span>Supersets and 2–4 hard sets per lift. Strength training's mortality benefit peaks around 30–60 min/week (Momma 2022), and trained lifters keep gaining strength on low volume.</span></div></li>
      <li><div><b>Lifting and cardio share sessions safely.</b><span>Concurrent-training meta-analyses find no meaningful loss of strength or size. Power is the one thing that suffers, so jumps come first on Saturday, before the intervals.</span></div></li>

      <li><div><b>Loaded full range does double duty as mobility.</b><span>Resistance training through full range improves flexibility about as much as stretching does (Alizadeh 2023). Cossacks, ATG split squats and deep squats are mobility work.</span></div></li>
      <li><div><b>Side-to-side and rotation added.</b><span>Cossacks, Copenhagens and rotational throws fill the frontal and transverse planes, the ones you need for catching falls and keeping up with kids.</span></div></li>
      <li><div><b>Knee care is strength-first.</b><span>Hip plus knee strengthening beats knee work alone for patellofemoral pain (Nascimento 2018). IT band rolling was dropped. You also get a written flare-up protocol.</span></div></li>
      <li><div><b>Power is protected.</b><span>Muscle power declines sooner and faster than strength, and it predicts falls and function better. Jumps, throws and swings stay in every week.</span></div></li>
    </ol>
  </section>
  <section class="panel">

    <div class="seg">${["all","keep","change","cut","add"].map(k => `<button class="chip" data-wf="${k}" aria-pressed="${k===filt}">${k==="all"?"All":label[k]}</button>`).join("")}</div>
    <div class="verdicts">${R.filter(r => filt==="all" || r[0]===filt).map(r => `<div class="vrow"><b><span class="stamp st-${r[0]}">${label[r[0]]}</span>${esc(r[1])}</b><span>${esc(r[2])}</span></div>`).join("")}</div>

  <section class="panel">

    <ul class="plain">
      <li><b>Peter Attia's Centenarian Decathlon:</b> stability, strength, Zone 2 and VO2max as four separate pillars, planned backward from what you want to do at 80.</li>
      <li><b>Tactical Barbell:</b> concurrent strength and conditioning with a small set of lifts, run on a fixed block structure.</li>
      <li><b>Knees Over Toes (Ben Patrick):</b> backward walking, tibialis raises, ATG split squat. Your knee base stays intact.</li>
      <li><b>Dan John:</b> loaded carries and "easy strength." Few lifts, done often, never to failure.</li>
      <li><b>Norwegian 4×4 (Helgerud, Wisløff):</b> the interval format.</li>
    </ul>
  </section>
  <section class="panel">

    <div class="src">
      <div><a href="https://www.tctmd.com/news/big-fitness-equals-big-survival-benefit-new-study-shows" target="_blank" rel="noopener">Mandsager et al. 2018, JAMA Netw Open: cardiorespiratory fitness and mortality</a><div class="who">122k adults; low vs. elite fitness HR ≈ 5.0 (TCTMD summary)</div></div>
      <div><a href="https://bjsm.bmj.com/content/56/13/755" target="_blank" rel="noopener">Momma et al. 2022, BJSM: muscle-strengthening and mortality</a><div class="who">Peak risk reduction at ~30–60 min/week</div></div>
      <div><a href="https://hsph.harvard.edu/news/exercising-more-than-recommended-could-lengthen-life-study-suggests" target="_blank" rel="noopener">Lee et al. 2022, Circulation: activity dose and mortality</a><div class="who">150–300 vigorous or 300–600 moderate min/week ≈ near-max benefit</div></div>
      <div><a href="https://inscyd.com/article/hiit-vs-norwegian-4x4/" target="_blank" rel="noopener">Norwegian 4×4 vs. other HIIT (INSCYD)</a><div class="who">Practitioner review of the Helgerud 2007 protocol</div></div>
      <div><a href="https://peterattiamd.com/ama39" target="_blank" rel="noopener">Attia, AMA #39: Centenarian Decathlon, Zone 2, VO2max</a><div class="who">Weekly structure of the four pillars</div></div>
      <div><a href="https://sportrxiv.org/index.php/server/preprint/view/37" target="_blank" rel="noopener">Schumann et al. 2022: concurrent training meta-analysis</a><div class="who">No meaningful hypertrophy or max-strength interference; power is more sensitive</div></div>
      <div><a href="https://www.strongerbyscience.com/one-set-muscle/" target="_blank" rel="noopener">Stronger by Science: how little volume still works</a><div class="who">Low-volume strength evidence (Korakakis, Pelland)</div></div>

      <div><a href="https://pubmed.ncbi.nlm.nih.gov/36525533/" target="_blank" rel="noopener">2022 meta-analysis: stretching and strength training</a><div class="who">Pre-lift stretching shows a small negative effect; do it separately</div></div>
      <div><a href="https://www.omicsdi.org/dataset/biostudies-literature/S-EPMC9935664" target="_blank" rel="noopener">Alizadeh et al. 2023: resistance training vs. stretching for range of motion</a><div class="who">No significant difference between the two</div></div>
      <div><a href="https://bjsm.bmj.com/content/53/21/1362" target="_blank" rel="noopener">van Dyk et al. 2019, BJSM: Nordic hamstring exercise</a><div class="who">Up to 51% fewer hamstring injuries (a later reappraisal is more cautious)</div></div>

/* ---------- keep the screen on while training ---------- */
let wake = null;
async function keepAwake(on){
  try{
    if (on && !wake && navigator.wakeLock && document.visibilityState === "visible") { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); }
    if (!on && wake) { await wake.release(); wake = null; }
  }catch(e){ wake = null; }
}
document.addEventListener("visibilitychange", () => keepAwake(store.get("tab","week") === "train"));

/* ---------- router ---------- */
const TABS = ["week","train","home","moves","why"];
function show(tab, push){
  if (!TABS.includes(tab)) tab = "week";
  keepAwake(tab === "train");
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  const v = $("#view"); v.innerHTML = V[tab]();
  store.set("tab", tab);
  if (push) { try{ history.replaceState(null, "", "#" + tab); }catch(e){} }
  window.scrollTo(0, 0);
  if (tab === "week") v.querySelectorAll("[data-go]").forEach(el => {
    const go = () => { store.set("day", el.dataset.go); show("train", true); };
    el.addEventListener("click", go); el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  if (tab === "train") {
    const s = store.get("day", null);
    const cur = v.querySelector('.pp[aria-pressed="true"]').dataset.day;
    v.querySelectorAll(".pp").forEach(b => b.addEventListener("click", () => { store.set("day", b.dataset.day); show("train"); }));
    const sess = S.find(x => x.id === cur);
    bindRows(v, cur, sess.plate);
    $("#reset").addEventListener("click", () => { store.set("done-"+cur, {}); show("train"); });
  }
  if (tab === "home") bindRows(v, null, null);
  if (tab === "moves") {
    renderLib();
    $("#q").addEventListener("input", e => { libQ = e.target.value; renderLib(); });
    v.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { libTag = c.dataset.tag; v.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c)); renderLib(); }));
  }
  if (tab === "why") v.querySelectorAll("[data-wf]").forEach(c => c.addEventListener("click", () => { store.set("whyf", c.dataset.wf); const y = window.scrollY; show("why"); window.scrollTo(0, y); }));
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab, true)));
const h = (location.hash || "").slice(1);
show(TABS.includes(h) ? h : store.get("tab", "week"));
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (TABS.includes(t)) show(t); });
</script>
